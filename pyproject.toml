[project]
name = "hackaton"
version = "0.1.0"
description = "Hackathon : backend FastAPI + module ML"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "numpy>=2.5.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
# Pas un paquet installable : on lance tout depuis la racine (imports `backend.*`, `ml.*`).
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]
pythonpath = ["."]
