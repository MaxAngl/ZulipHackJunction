[project]
name = "hackaton"
version = "0.1.0"
description = "Hackathon : backend FastAPI + module ML"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "garminconnect>=0.3.20",
    "numpy>=2.5.4",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
# Pas un paquet installable : on lance tout depuis la racine (imports `backend.*`, `ml.*`).
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# PyTorch en version CPU, sur toutes les machines et dans la CI : les réseaux sont petits,
# et la version par défaut sous Linux télécharge plusieurs Go de bibliothèques GPU inutiles.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests", "garmin/tests"]
pythonpath = ["."]
