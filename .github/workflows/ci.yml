# Mêmes vérifications que le pre-commit local, sur chaque PR et chaque push sur main.
# Filet de sécurité si quelqu'un n'a pas installé les hooks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Hooks et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dépendances Python
        run: uv sync --locked

      - name: Dépendances front
        run: npm ci
        working-directory: frontend

      - name: Format, lint, types, contrat d'API, tests
        run: uv run pre-commit run --all-files --show-diff-on-failure
